name: Build, Scan, and Publish Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1. Setup Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Sanitize Image Name (Forces lowercase for Docker compatibility)
      - name: Set lower case image name
        run: |
          # Converts repo name (e.g., m0n7i-Labs/vulnerable-app) to lowercase
          echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/vulnerable-java" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      # 3. Build the JAR file
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build the Docker Image locally
      - name: Build Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_TAG }}:latest
            ${{ env.IMAGE_TAG }}:${{ github.sha }}

      # 6. Wiz CLI Setup and Scan
      - name: Download Wiz CLI
        run: curl -o wizcli https://downloads.wiz.io/wizcli/latest/wizcli-linux-amd64 && chmod +x wizcli

      - name: Authenticate to Wiz
        run: ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Run wiz-cli docker image scan
        # This uses the sanitized lowercase tag
        run: ./wizcli docker scan --image ${{ env.IMAGE_TAG }}:latest
